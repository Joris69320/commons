name: Build release
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, '[RELEASE]:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Compute release version
        id: ver
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          RELEASE_VERSION="${VERSION%-SNAPSHOT}"
          if [ "$VERSION" = "$RELEASE_VERSION" ]; then
            echo "No -SNAPSHOT in version ($VERSION)."
          fi
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$RELEASE_VERSION" >> $GITHUB_OUTPUT
      - name: Remove SNAPSHOT qualifier
        run: |
          mvn -B versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false
      - name: Commit version bump
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          git commit -m "[RELEASE]: ${{ steps.ver.outputs.tag }}"
          git push
      - name: Build
        run: mvn -B clean package


